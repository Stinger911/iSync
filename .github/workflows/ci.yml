name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build, vet, test (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build
        run: go build ./...

      - name: Build release binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/isync ./cmd/isync
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/isyncd ./cmd/isyncd

      - name: Check install script syntax
        if: matrix.goarch == 'amd64'
        run: bash -n scripts/install.sh

      - name: Vet
        run: go vet ./...

      - name: Test (native arch only)
        if: matrix.goarch == 'amd64'
        run: go test ./... -race -cover
